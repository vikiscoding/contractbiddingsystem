[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity_ingest"
version = "0.1.0"
description = "CanadaBuys open tender CSV → local SQLite (default) with pluggable SharePoint later"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Contract Bidding System" }]
# Keep floors in sync with requirements.txt.
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
sheets = [
    "gspread>=6.0",
    "google-auth>=2.0",
]
ai = [
    "openai>=1.40",
]

[project.scripts]
opportunity-ingest = "opportunity_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
