# Engineering-owned keyword config for CanadaBuys open-tender filtering.
# Tuned for Atlas Flow Group capabilities (site crawl 2026-08-11):
#   https://atlasflowgroupwebsite.vikrant-singh1.workers.dev/
# Ops request changes via GitHub issues; eng reviews/merges.
#
# Atlas Flow Group is NOT a classic MSP / ServiceNow SI / construction vendor.
# Prefer: operating-model advisory, human-governed AI, Microsoft-native enablement
#   (M365, Copilot, Power Platform), process/workflow under authority design.
# Avoid bare high-noise terms (teams, strategy, service desk alone).
#
# Matching notes:
# - Short terms (len <= short_term_max_len) use word-boundary regex.
# - Unique-by-term weights; nested overlaps are span-aware.
# - Terms dual-listed across groups contribute one weight but all groups for scoring.
version: 1
match:
  case_sensitive: false
  fields: ["title", "description"]
  search_category: true
  short_term_max_len: 4

groups:
  # Critical — site: "Microsoft-native", M365, Copilot, Power Platform
  microsoft_cloud:
    label: "Microsoft-native (M365 / Copilot / Power Platform / Azure)"
    keywords:
      - { term: "microsoft 365", weight: 22 }
      - { term: "microsoft365", weight: 22 }
      - { term: "m365", weight: 20 }
      - { term: "office 365", weight: 18 }
      - { term: "o365", weight: 15 }
      - { term: "microsoft-native", weight: 20 }
      - { term: "microsoft native", weight: 20 }
      - { term: "sharepoint", weight: 16 }
      - { term: "power platform", weight: 22 }
      - { term: "power apps", weight: 20 }
      - { term: "power automate", weight: 20 }
      - { term: "power bi", weight: 12 }
      - { term: "copilot", weight: 22 }
      - { term: "microsoft copilot", weight: 22 }
      - { term: "azure", weight: 12 }
      - { term: "entra id", weight: 14 }
      - { term: "active directory", weight: 10 }
      - { term: "microsoft teams", weight: 12 }
      - { term: "dynamics 365", weight: 10 }

  # Critical — site: Authority, operating model, source of truth, runbooks, registries
  operating_authority:
    label: "Operating model / authority / governance design"
    keywords:
      - { term: "operating model", weight: 22 }
      - { term: "operating system", weight: 12 }
      - { term: "source of truth", weight: 18 }
      - { term: "source of authority", weight: 20 }
      - { term: "decision rights", weight: 16 }
      - { term: "operating contract", weight: 18 }
      - { term: "operating contracts", weight: 18 }
      - { term: "runbook", weight: 14 }
      - { term: "runbooks", weight: 14 }
      - { term: "governance model", weight: 16 }
      - { term: "governance framework", weight: 16 }
      - { term: "corporate governance", weight: 10 }
      - { term: "operational governance", weight: 18 }
      - { term: "process governance", weight: 16 }
      - { term: "business process", weight: 12 }
      - { term: "process design", weight: 14 }
      - { term: "process discipline", weight: 14 }
      - { term: "traceability", weight: 12 }
      - { term: "accountability", weight: 10 }

  # High — lead offering on /services
  advisory_consulting:
    label: "Advisory / operating-model consulting"
    keywords:
      - { term: "advisory services", weight: 18 }
      - { term: "advisory service", weight: 16 }
      - { term: "management consulting", weight: 12 }
      - { term: "professional services", weight: 10 }
      - { term: "digital transformation", weight: 12 }
      - { term: "change management", weight: 12 }
      - { term: "business analysis", weight: 10 }
      - { term: "operations assessment", weight: 16 }
      - { term: "organisational design", weight: 12 }
      - { term: "organizational design", weight: 12 }
      - { term: "business transformation", weight: 12 }

  # High — site: automation & agents only under human authority
  automation_process:
    label: "Workflow automation / agents under governance"
    keywords:
      - { term: "workflow automation", weight: 18 }
      - { term: "workflow design", weight: 16 }
      - { term: "process automation", weight: 16 }
      - { term: "process improvement", weight: 14 }
      - { term: "business process automation", weight: 16 }
      - { term: "robotic process", weight: 12 }
      - { term: "rpa", weight: 12 }
      - { term: "low code", weight: 14 }
      - { term: "no code", weight: 12 }
      - { term: "power automate", weight: 20 }
      - { term: "orchestration", weight: 10 }
      - { term: "intelligent automation", weight: 14 }
      # Bare "automation" kept moderate — many false friends in construction notices
      - { term: "automation", weight: 10 }

  # High — site: human-governed AI, AI assistance without authority (not unowned GenAI product)
  ai_operations:
    label: "Human-governed AI / AI assistance / responsible AI"
    keywords:
      - { term: "artificial intelligence", weight: 14 }
      - { term: "generative ai", weight: 16 }
      - { term: "genai", weight: 14 }
      - { term: "ai governance", weight: 22 }
      - { term: "responsible ai", weight: 20 }
      - { term: "ai assistance", weight: 18 }
      - { term: "human in the loop", weight: 16 }
      - { term: "human-in-the-loop", weight: 16 }
      - { term: "ai adoption", weight: 14 }
      - { term: "ai enablement", weight: 16 }
      - { term: "llm", weight: 12 }
      - { term: "machine learning", weight: 10 }
      - { term: "data governance", weight: 14 }
      - { term: "ai operations", weight: 12 }

  # Low / selective — only when notice is really about knowledge ops / continuous improvement loops
  knowledge_flow:
    label: "Knowledge / continuous operating flow"
    keywords:
      - { term: "knowledge management", weight: 12 }
      - { term: "knowledge base", weight: 10 }
      - { term: "continuous improvement", weight: 12 }
      - { term: "operational excellence", weight: 12 }
      - { term: "shared services", weight: 10 }

# Prefer services-style procurement categories (not construction).
category_boosts:
  "*SRV": 5
  "SRV": 5
  "*SVRTGD": 3
  "SVRTGD": 3
